<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discussion - Forum Warframe</title>
  <link rel="stylesheet" href="assets/index.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Retour accueil Forum Warframe">
        <span class="brand-mark">WF</span>
        <span class="brand-text">
          Forum Warframe
          <span>Discussion</span>
        </span>
      </a>

      <nav class="header-actions" aria-label="Navigation utilisateur">
        <a class="header-link" href="index.html">Accueil</a>
        <a class="header-link" href="auth.html?mode=login">Connexion</a>
        <a class="primary-link" href="auth.html?mode=register">Inscription</a>
      </nav>
    </div>
  </header>

  <main class="detail-layout">
    <a class="back-link" href="index.html">Retour aux questions</a>

    <section class="detail-card" data-post-detail aria-busy="true">
      <div class="post-meta">
        <span class="author" data-author></span>
        <span>·</span>
        <time data-created-at></time>
      </div>

      <h1 data-title></h1>
      <p data-content></p>
      <img class="detail-image" alt="" data-image hidden>
      <div class="tags" data-tags></div>

      <div class="detail-stats">
        <span><strong data-score>0</strong> score</span>
        <span><strong data-comments-count>0</strong> reponses</span>
      </div>
    </section>

    <section class="comments-panel" id="comments">
      <div class="comments-header">
        <h2>Reponses</h2>
        <span data-comments-label>0 commentaire</span>
      </div>

      <form class="comment-form" data-comment-form>
        <label for="comment-content">Ajouter une reponse</label>
        <textarea id="comment-content" name="content" rows="4" minlength="2" required placeholder="Partage une reponse claire et utile."></textarea>
        <div class="form-actions">
          <button class="primary-button" type="submit">Repondre</button>
        </div>
      </form>

      <div class="empty-state" data-detail-alert></div>
      <div class="comment-list" data-comment-list></div>
    </section>
  </main>

  <template id="comment-template">
    <article class="comment-card">
      <div class="post-meta">
        <span class="author" data-comment-author></span>
        <span>·</span>
        <time data-comment-created-at></time>
      </div>
      <p data-comment-content></p>
    </article>
  </template>

  <script>
    const params = new URLSearchParams(window.location.search);
    const postId = params.get("id");
    const detail = document.querySelector("[data-post-detail]");
    const alertBox = document.querySelector("[data-detail-alert]");
    const commentForm = document.querySelector("[data-comment-form]");
    const commentList = document.querySelector("[data-comment-list]");
    const commentTemplate = document.querySelector("#comment-template");

    const getAccessToken = () => localStorage.getItem("access_token");

    const requireAuth = () => {
      if (getAccessToken()) {
        return true;
      }

      window.location.assign("auth.html?mode=login");
      return false;
    };

    const showAlert = (message) => {
      alertBox.textContent = message;
      alertBox.style.display = "block";
    };

    const hideAlert = () => {
      alertBox.textContent = "";
      alertBox.style.display = "none";
    };

    const formatDate = (value) => {
      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "";
      }

      return new Intl.DateTimeFormat("fr-FR", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    };

    const renderTags = (tags) => {
      const container = detail.querySelector("[data-tags]");
      const items = (Array.isArray(tags) ? tags : []).map((tag) => {
        const item = document.createElement("span");
        item.className = "tag";
        item.textContent = `#${tag.name}`;
        return item;
      });

      container.replaceChildren(...items);
    };

    const renderPost = (post) => {
      document.title = `${post.title} - Forum Warframe`;

      detail.querySelector("[data-author]").textContent = post.author || "Utilisateur";
      detail.querySelector("[data-created-at]").dateTime = post.created_at;
      detail.querySelector("[data-created-at]").textContent = formatDate(post.created_at);
      detail.querySelector("[data-title]").textContent = post.title;
      detail.querySelector("[data-content]").textContent = post.content;
      detail.querySelector("[data-score]").textContent = post.score;
      detail.querySelector("[data-comments-count]").textContent = post.comments_count;

      const image = detail.querySelector("[data-image]");
      if (post.image_url) {
        image.src = post.image_url;
        image.hidden = false;
      } else {
        image.hidden = true;
      }

      renderTags(post.tags);
    };

    const renderComments = (comments) => {
      const items = comments.map((comment) => {
        const fragment = commentTemplate.content.cloneNode(true);
        fragment.querySelector("[data-comment-author]").textContent = comment.author || "Utilisateur";
        fragment.querySelector("[data-comment-created-at]").dateTime = comment.created_at;
        fragment.querySelector("[data-comment-created-at]").textContent = formatDate(comment.created_at);
        fragment.querySelector("[data-comment-content]").textContent = comment.content;
        return fragment;
      });

      commentList.replaceChildren(...items);
      document.querySelector("[data-comments-label]").textContent = `${comments.length} commentaire${comments.length > 1 ? "s" : ""}`;
    };

    const loadPost = async () => {
      if (!postId) {
        showAlert("Identifiant de post manquant.");
        detail.setAttribute("aria-busy", "false");
        return;
      }

      hideAlert();
      detail.setAttribute("aria-busy", "true");

      try {
        const response = await fetch(`/api/posts/${postId}`);
        const payload = await response.json();

        if (!response.ok) {
          throw new Error(payload.message || "Impossible de charger la discussion.");
        }

        renderPost(payload.post);
        renderComments(payload.comments || []);
      } catch (error) {
        showAlert(error.message);
      } finally {
        detail.setAttribute("aria-busy", "false");
      }
    };

    const createComment = async () => {
      if (!requireAuth()) {
        return;
      }

      const submitButton = commentForm.querySelector("button[type='submit']");
      const content = new FormData(commentForm).get("content").trim();

      submitButton.disabled = true;
      hideAlert();

      try {
        const response = await fetch(`/api/posts/${postId}/comments`, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${getAccessToken()}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ content })
        });
        const payload = await response.json();

        if (!response.ok) {
          throw new Error(payload.message || "Impossible d'ajouter la reponse.");
        }

        commentForm.reset();
        await loadPost();
      } catch (error) {
        showAlert(error.message);
      } finally {
        submitButton.disabled = false;
      }
    };

    commentForm.addEventListener("submit", (event) => {
      event.preventDefault();
      createComment();
    });

    loadPost();
  </script>
</body>
</html>
